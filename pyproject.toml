[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "6equj5-game"
version = "1977.815"
description = "The Fermi Override: an offline science-fiction action adventure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5.0", "Pillow>=10.0.0", "numpy>=1.24.0"]

[project.scripts]
6equj5-game = "video_game.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=77", "wheel"]

[tool.setuptools]
include-package-data = false
packages = ["video_game", "video_game.engine", "video_game.engine.bosses", "video_game.engine.labs", "video_game.engine.scenes", "video_game.engine.ui"]
package-dir = { video_game = "src" }

[tool.setuptools.package-data]
video_game = ["assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
